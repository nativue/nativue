name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its run; every commit on main keeps its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx prettier --check packages examples

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      # Generates android/ from nativue.config.ts, as on a fresh clone.
      - run: npx nativue build
        working-directory: examples/demo
      - run: ./gradlew assembleDebug
        working-directory: examples/demo/android

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: mkdir -p examples/demo/native/extensions && cp -R packages/core/test/fixtures/NotificationService examples/demo/native/extensions/
      - run: npx nativue build
        working-directory: examples/demo
      - run: >-
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: examples/demo/ios
      - name: The extension is embedded, with its principal class
        run: >-
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass'
          examples/demo/ios/build/Build/Products/Debug-iphonesimulator/App.app/PlugIns/NotificationService.appex/Info.plist
